name: MCP drift check

on:
  schedule:
    - cron: '0 8 * * 1'   # Monday morning, before anyone relies on a stale skill
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Tier 1: has any connector's tool surface changed?
      - name: Check for schema drift
        run: npx tether-mcp check --out drift.md

      # Tier 2: do the identifiers skills declare still exist?
      # Only probes a human has put on the allowlist are ever called.
      - name: Check for instance drift
        if: always()
        run: npx tether-mcp resolve --out instance-drift.md

      - name: Publish report
        if: always()
        run: cat drift.md instance-drift.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
